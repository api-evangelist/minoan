aid: minoan
name: Minoan
description: 'Minoan is a hospitality procurement and shoppable-stays platform. Short-term-rental
  hosts, property managers, hotels, and interior designers source furniture, decor, and home
  goods at insider/trade pricing through Minoan''s purchasing platform, and earn revenue share
  when guests buy the items they experienced during a stay. Founded to turn every hosted space
  into a shoppable showroom, Minoan connects properties to hundreds of home-and-lifestyle brands
  and handles sourcing, checkout, and fulfillment. Backed by Accel. As of this profile Minoan
  exposes no public developer API; this record captures its public web, security, and llms.txt
  surface.'
